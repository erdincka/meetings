# In-cluster image registry.
#
# Replaces `kind load`, which only existed because kind nodes are containers
# with their own image stores. A real registry means images are pushed once and
# pulled by any node -- and it removes the awkwardness where a rebuilt image had
# to be explicitly re-loaded before the cluster could see it.
#
# Plain HTTP on the LAN: this is a lab registry holding nothing secret, and TLS
# would mean distributing a CA to every node for no benefit here. The nodes are
# configured to treat it as insecure accordingly.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: registry:3
          ports:
            - {name: http, containerPort: 5000}
          env:
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 50Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: LoadBalancer
  # Pinned so the push URL never changes under you.
  loadBalancerIP: 10.1.1.240
  selector: {app: registry}
  ports:
    - {name: http, port: 5000, targetPort: http}

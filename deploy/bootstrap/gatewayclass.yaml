# Envoy Gateway installs the Gateway API CRDs and its controller, but does not
# create a GatewayClass -- that is left to the platform owner.
#
# This is precisely what was missing on the k3s cluster this replaces: the
# Gateway API CRDs were present (installed by Traefik) but there was no
# GatewayClass and Traefik was never started with --providers.kubernetesgateway,
# so the whole Gateway API surface was inert.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Pins the data-plane Service shape; see below.
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: envoy-gateway-system
---
# kind has no LoadBalancer implementation, so an EXTERNAL-IP never arrives and
# the Service falls back to a randomly allocated NodePort. deploy/kind/cluster.yaml
# maps host :80 -> node :30080, so the port has to be fixed to line up.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  targetPort: 10080
                  nodePort: 30080

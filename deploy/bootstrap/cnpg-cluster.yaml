# Postgres for Agentic Meetings.
#
# pgvector arrives as a Kubernetes ImageVolume rather than a custom-baked
# Postgres image: CNPG mounts the extension read-only at /extensions/pgvector
# and wires extension_control_path / dynamic_library_path automatically. This
# needs PostgreSQL 18+ (for the extension_control_path GUC), containerd 2.1+
# (we run 2.3.1) and the ImageVolume feature gate (enabled in cluster.yaml).
#
# Because extensions are mounted separately, the base image is the *minimal*
# variant rather than -system or -standard.
apiVersion: v1
kind: Secret
metadata:
  name: meetings-metrics-ro
  namespace: meetings
type: kubernetes.io/basic-auth
stringData:
  username: metrics_ro
  # Dev-only credential. Real deployments source this from an external secret
  # manager; it is committed here so `make kind-up` is reproducible.
  password: metrics-ro-local-dev
---
# The same credential as a connection string, in the namespace that actually
# consumes it.
#
# Secrets are namespace-scoped: the persona sandboxes run in
# meetings-sandboxes and cannot project a Secret from meetings, so the
# projection above resolved to nothing and query_business_metrics reported
# "no metrics credential is mounted" for every persona that had the tool.
# Only the profiles whose SandboxTemplate declares needsMetricsDsn mount this.
apiVersion: v1
kind: Secret
metadata:
  name: meetings-metrics-ro
  namespace: meetings-sandboxes
type: Opaque
stringData:
  dsn: postgresql://metrics_ro:metrics-ro-local-dev@meetings-postgres-rw.meetings.svc:5432/meetings
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: meetings-postgres
  namespace: meetings
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie

  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.1-202602120909-18-trixie

  bootstrap:
    initdb:
      database: meetings
      owner: appuser
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

        # The business-metrics schema queried by the `analyst` capability
        # profile. It is deliberately a SEPARATE role from the app owner: the
        # DSN handed to analyst sandboxes can read these tables and nothing
        # else, so a prompt-injected agent cannot reach application data.
        - CREATE SCHEMA IF NOT EXISTS metrics;
        # postInitApplicationSQL runs as the superuser, so the schema is owned
        # by postgres and the application role cannot populate it. The seeder
        # runs as appuser.
        - GRANT ALL ON SCHEMA metrics TO appuser;
        - CREATE ROLE metrics_ro LOGIN PASSWORD 'metrics-ro-local-dev';
        - ALTER ROLE metrics_ro SET default_transaction_read_only = on;
        - ALTER ROLE metrics_ro SET statement_timeout = '5s';
        # Agents write `FROM fact_revenue`, not `FROM metrics.fact_revenue`,
        # because that is how the tool documents the schema. Without this the
        # table simply does not exist to them and the tool reports a failure
        # that reads like an outage.
        - ALTER ROLE metrics_ro SET search_path = metrics;
        - GRANT USAGE ON SCHEMA metrics TO metrics_ro;
        - GRANT SELECT ON ALL TABLES IN SCHEMA metrics TO metrics_ro;
        - ALTER DEFAULT PRIVILEGES IN SCHEMA metrics GRANT SELECT ON TABLES TO metrics_ro;
        # Belt and braces: no reach into the application schema at all.
        - REVOKE ALL ON SCHEMA public FROM metrics_ro;

  storage:
    size: 5Gi

  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: "1",  memory: 1Gi}

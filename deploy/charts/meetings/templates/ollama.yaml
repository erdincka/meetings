{{- if .Values.ollama.enabled }}
{{/*
In-cluster inference for the `ollama` values profile. Keeps the demo runnable
with no API key at all, at the cost of a large resident model -- see
docs/local-cluster.md for the sizing trade-off against sandbox capacity.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meetings.name" . }}-ollama
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meetings.name" . }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meetings.name" . }}
        app.kubernetes.io/component: ollama
    spec:
      initContainers:
        - name: pull-model
          image: {{ .Values.ollama.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull {{ .Values.ollama.model }}
          env:
            - name: OLLAMA_MODELS
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: models
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "meetings.name" . }}-ollama
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meetings.name" . }}-ollama
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "meetings.name" . }}
    app.kubernetes.io/component: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
{{- if .Values.ollama.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meetings.name" . }}-ollama
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}
{{- end }}

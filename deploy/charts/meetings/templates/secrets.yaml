{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{/*
Operator tokens.

Generated once and kept thereafter. The `lookup` is what makes that true: on an
upgrade the existing Secret is read back and its values reused, so a `helm
upgrade` does not silently rotate every operator's token and lock the room out
of the UI mid-demo. On a first install, or under `helm template` where there is
no cluster to look up, fresh values are generated.

An operator who wants to manage tokens themselves sets `auth.existingSecret` and
this is not rendered at all.
*/}}
{{- $name := printf "%s-auth" (include "meetings.name" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $operator := "" }}
{{- $viewer := "" }}
{{- if $existing }}
{{- $operator = index $existing.data .Values.auth.operatorTokenKey | default "" }}
{{- $viewer = index $existing.data .Values.auth.viewerTokenKey | default "" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "meetings.labels" . | nindent 4 }}
  annotations:
    # Helm would otherwise delete and recreate this on an uninstall/reinstall
    # cycle, changing the tokens without anyone asking it to.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.auth.operatorTokenKey }}: {{ $operator | default (randAlphaNum 40 | b64enc) | quote }}
  {{ .Values.auth.viewerTokenKey }}: {{ $viewer | default (randAlphaNum 40 | b64enc) | quote }}
---
{{- end }}
{{/*
Non-secret configuration only. Credentials live in the Secret named by
.Values.inference.existingSecret, which is created out of band -- the chart
never templates an API key, so `helm get values` and the release Secret stay
clean.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meetings.name" . }}-config
  labels: {{- include "meetings.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "meetings.otlpEndpoint" . | quote }}
  LLM_TIMEOUT_SECONDS: {{ .Values.inference.timeoutSeconds | quote }}
  ALLOWED_ORIGINS: {{ printf "http://%s,https://%s" .Values.gateway.host .Values.gateway.host | quote }}
  ALLOW_VOLATILE_CHECKPOINTS: {{ .Values.allowVolatileCheckpoints | quote }}
  EMBEDDING_DIM: {{ .Values.inference.embedding.dimensions | quote }}
  # Sandboxes call the model through this rather than reaching the provider.
  SANDBOX_LLM_PROXY_URL: {{ printf "http://%s-backend.%s.svc:8000/internal/v1/llm" (include "meetings.name" .) .Release.Namespace | quote }}
  SANDBOX_NAMESPACE: {{ .Values.sandbox.namespace | quote }}
  SANDBOX_EXEC_NAMESPACE: {{ .Values.sandbox.execNamespace | quote }}
  INFERENCE_ENDPOINT: {{ .Values.inference.endpoint | quote }}
  INFERENCE_MODEL_NAME: {{ .Values.inference.modelName | quote }}
  EMBEDDING_ENDPOINT: {{ .Values.inference.embedding.endpoint | quote }}
  EMBEDDING_MODEL_NAME: {{ .Values.inference.embedding.modelName | quote }}
  INFERENCE_IGNORE_TLS: {{ .Values.inference.ignoreTls | quote }}
  INFERENCE_REASONING_EFFORT: {{ .Values.inference.reasoningEffort | quote }}
  SUPERVISOR_REASONING_EFFORT: {{ .Values.inference.supervisorReasoningEffort | quote }}
  EMBEDDING_IGNORE_TLS: {{ .Values.inference.embedding.ignoreTls | quote }}
  AUTH_ENABLED: {{ .Values.auth.enabled | quote }}

{{- if .Values.corpus.enabled }}
{{/*
Static corpus service backing search_corpus.

Offline by design: a demo that reaches the live internet is not reproducible,
and it would need sandbox egress to arbitrary hosts -- exactly what the per-
profile network policies exist to prevent. Only profiles granted the tool have
egress to this Service at all.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meetings.name" . }}-corpus
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meetings.name" . }}
      app.kubernetes.io/component: corpus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meetings.name" . }}
        app.kubernetes.io/component: corpus
    spec:
      securityContext: {{- include "meetings.podSecurityContext" . | nindent 8 }}
      containers:
        - name: corpus
          image: {{ include "meetings.image" (dict "registry" .Values.image.registry "image" .Values.corpus.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "meetings.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meetings.name" . }}-corpus
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "meetings.name" . }}
    app.kubernetes.io/component: corpus
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}

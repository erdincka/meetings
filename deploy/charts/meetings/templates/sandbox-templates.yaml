{{/*
Capability profiles.

One runtime image serves every profile. What a given sandbox may actually do is
decided here -- the mounted capability file, the ServiceAccount it runs as, and
(from Phase 3) its NetworkPolicy and Secret mounts -- not by which image it
runs. That separation is the point of the whole design, so it is worth stating
plainly rather than burying in values.

Phase 2 ships the baseline profile only. Phase 3 adds analyst, counsel,
strategist and chief, which is where the least-privilege story becomes visible.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: persona-baseline
  namespace: {{ .Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: persona-baseline-capabilities
  namespace: {{ .Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" . | nindent 4 }}
data:
  # The runtime intersects the backend's grant with this list, so a compromised
  # or buggy backend cannot enable a tool this profile was not provisioned for.
  capabilities: |
    retrieve_documents
---
# SandboxTemplate and SandboxWarmPool are extension CRDs and live in
# extensions.agents.x-k8s.io. Only the core Sandbox kind is in agents.x-k8s.io.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: persona-baseline
  namespace: {{ .Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  # Publishes a per-sandbox Service. The backend reaches persona runtimes over
  # cluster DNS; the Sandbox Router is only needed from outside the cluster,
  # where port-forward is unusable because it is incompatible with gVisor.
  service: true

  # Declared explicitly rather than left to the controller.
  #
  # With networkPolicyManagement defaulting to Managed and no policy given, the
  # controller synthesises a sensible default: ingress only from the Sandbox
  # Router, egress to the public internet with every RFC1918 range excluded.
  # That assumes all traffic goes through the Router. This design calls persona
  # runtimes directly over cluster DNS, so the two paths it actually needs are
  # opened here and nothing else is.
  #
  # This field is the fourth of the five enforcement layers, and the one Phase 3
  # uses to give each capability profile a different reachable surface -- an
  # analyst may reach Postgres, a baseline persona may not, so a stolen DSN is
  # useless to the wrong profile.
  networkPolicy:
    ingress:
      # Only the backend may drive a turn.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: {{ include "meetings.name" . }}
                app.kubernetes.io/component: backend
        ports:
          - protocol: TCP
            port: 8080
      # The controller's own reconciliation and the Router, if deployed.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: agent-sandbox-system
    egress:
      # Cluster DNS.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      # The backend's internal API: retrieval, artifacts, action items. This is
      # the only in-cluster destination a baseline persona may reach -- notably
      # NOT Postgres, which it has no credential for either.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: {{ include "meetings.name" . }}
                app.kubernetes.io/component: backend
        ports:
          - protocol: TCP
            port: 8000
      # The inference endpoint. NetworkPolicy cannot match DNS names, so this
      # comes from values as explicit CIDRs -- see inference.egressCIDRs.
      {{- with .Values.inference.egressCIDRs }}
      - to:
          {{- range . }}
          - ipBlock:
              cidr: {{ . | quote }}
          {{- end }}
      {{- end }}
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meetings.name" . }}
        app.kubernetes.io/component: persona-sandbox
    spec:
      serviceAccountName: persona-baseline
      # Never hardcode gvisor: hosts without runsc fall back to crun (user
      # namespaces) or runc. See docs/sandbox-security-model.md.
      runtimeClassName: {{ .Values.sandbox.runtimeClassName }}
      automountServiceAccountToken: true
      nodeSelector:
        node-role: sandbox
      tolerations:
        - key: node-role
          operator: Equal
          value: sandbox
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: {{ include "meetings.image" (dict "registry" .Values.image.registry "image" .Values.sandbox.runtimeImage) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_INTERNAL_URL
              value: "http://{{ include "meetings.name" . }}-backend.{{ .Release.Namespace }}.svc:8000"
            - name: SANDBOX_CAPABILITY_FILE
              value: /etc/sandbox/capabilities
            - name: INFERENCE_API_KEY_FILE
              value: /etc/sandbox/secrets/inference-api-key
          volumeMounts:
            - name: capabilities
              mountPath: /etc/sandbox
              readOnly: true
            # Optional: absent for endpoints that need no authentication.
            - name: inference-key
              mountPath: /etc/sandbox/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources: {{- toYaml .Values.sandbox.profiles.baseline.resources | nindent 12 }}
      volumes:
        - name: capabilities
          configMap:
            name: persona-baseline-capabilities
            items:
              - key: capabilities
                path: capabilities
        - name: inference-key
          secret:
            secretName: {{ .Values.inference.existingSecret }}
            optional: true
            items:
              - key: {{ .Values.inference.apiKeyKey }}
                path: inference-api-key
        - name: tmp
          emptyDir: {}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: persona-baseline
  namespace: {{ .Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  # Pre-warmed so no turn ever pays a cold gVisor pod start, which is seconds
  # rather than the few hundred milliseconds a warm claim costs.
  replicas: {{ .Values.sandbox.profiles.baseline.warmReplicas }}
  sandboxTemplateRef:
    name: persona-baseline

{{/*
Per-profile sandbox provisioning.

One runtime image serves every profile. What a sandbox may actually do is
decided entirely here -- the capability file it mounts, the ServiceAccount it
runs as, the Secrets its template references, and the NetworkPolicy applied to
it. Nothing about the image differs.

Profiles come from profiles.yaml, generated from
backend/app/orchestration/profiles.py so the tools the runtime registers and the
Kubernetes objects that enforce them cannot drift apart.
*/}}
{{- $root := . }}
{{- range $profile := .Values.profiles }}
{{- $sa := printf "persona-%s" $profile.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $root.Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" $root | nindent 4 }}
    meetings/profile: {{ $profile.name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $sa }}-capabilities
  namespace: {{ $root.Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" $root | nindent 4 }}
data:
  # The runtime intersects the backend's grant with this list, so a compromised
  # or buggy backend cannot enable a tool this profile was not provisioned for.
  capabilities: |
    {{- range $profile.tools }}
    {{ . }}
    {{- end }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ $sa }}
  namespace: {{ $root.Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" $root | nindent 4 }}
    meetings/profile: {{ $profile.name }}
spec:
  service: true

  {{/*
  Declared explicitly rather than left to the controller. With no policy given
  the controller synthesises one that allows ingress only from the Sandbox
  Router; this design calls persona runtimes directly over cluster DNS.

  This is enforcement layer 4, and the per-profile differences below are what
  make a stolen credential useless to the wrong profile.
  */}}
  networkPolicy:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: {{ include "meetings.name" $root }}
                app.kubernetes.io/component: backend
        ports:
          - protocol: TCP
            port: 8080
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: agent-sandbox-system
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - {protocol: UDP, port: 53}
          - {protocol: TCP, port: 53}
      # The backend's internal API: retrieval, artifacts, action items.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: {{ include "meetings.name" $root }}
                app.kubernetes.io/component: backend
        ports:
          - {protocol: TCP, port: 8000}
      {{- if $profile.needsMetricsDsn }}
      # Only metrics-capable profiles may reach Postgres at all. A baseline
      # persona that somehow obtained the DSN still cannot use it: its packets
      # to 5432 are dropped before they leave the pod.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
            podSelector:
              matchLabels:
                cnpg.io/cluster: meetings-postgres
        ports:
          - {protocol: TCP, port: 5432}
      {{- end }}
      {{- if and $profile.needsCorpusEgress $root.Values.corpus.enabled }}
      # The external corpus, for profiles granted search_corpus. Everyone else
      # has no route to it, quite apart from the tool not being registered.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $root.Release.Namespace }}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: {{ include "meetings.name" $root }}
                app.kubernetes.io/component: corpus
        ports:
          - {protocol: TCP, port: 8080}
      {{- end }}
      {{- if $profile.canExecuteCode }}
      # Delivering a job to a claimed exec sandbox and collecting its output.
      # Only profiles that may execute code need this route; RBAC already
      # decides whether they can obtain a sandbox to talk to at all.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $root.Values.sandbox.execNamespace }}
        ports:
          - {protocol: TCP, port: 8080}
      {{- end }}
      {{- with (include "meetings.otlpEndpoint" $root) }}
      {{- $otlpPort := regexFind ":[0-9]+$" . | trimPrefix ":" | default "4317" }}
      # The trace collector. Added with the endpoint rather than always, because
      # a rule naming a namespace that does not exist is a rule nobody can read
      # the intent of later.
      #
      # Without this the sandbox is handed OTEL_EXPORTER_OTLP_ENDPOINT and then
      # forbidden to reach it: every persona logs an endless retry loop against
      # a collector it cannot see, and the claim that one turn renders as one
      # trace across all three trust boundaries is quietly false -- the backend
      # spans arrive, the sandbox spans never do. Configuration that tells a
      # pod to talk to something the network forbids produces a symptom that
      # looks nothing like a policy decision.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ $root.Values.observability.namespace }}
        ports:
          - {protocol: TCP, port: {{ $otlpPort }}}
      {{- end }}
      # The apiserver, for every profile -- including those that may not execute
      # code.
      #
      # It is tempting to block this for profiles without the grant, and it
      # would be marginally stronger. It is the wrong trade. RBAC is the
      # authoritative control here, and letting the request reach the apiserver
      # means a refusal comes back as a fast, unambiguous 403 that the agent can
      # report and the audit matrix can display. Blocking it at the network
      # instead produces a connection timeout: the turn stalls, and a policy
      # decision becomes indistinguishable from an outage.
      #
      # Making the denial legible is worth more than the extra layer, because a
      # denial nobody can see is a control nobody can trust.
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - {protocol: TCP, port: 443}
          - {protocol: TCP, port: 6443}
      # No rule for the model endpoint, deliberately. Personas reach it through
      # the backend's /internal/v1/llm proxy over the route already opened
      # above, so a sandbox has no path off the cluster at all beyond the
      # apiserver.
      #
      # This replaced an ipBlock list built from INFERENCE_EGRESS_CIDRS, which
      # could not work for a hosted provider: NetworkPolicy matches addresses,
      # a CDN-fronted endpoint has no stable ones, and the only way to make it
      # work was 0.0.0.0/0 -- opening the whole internet to the least-trusted
      # component in the system in order to reach one host.

  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meetings.name" $root }}
        app.kubernetes.io/component: persona-sandbox
        meetings/profile: {{ $profile.name }}
    spec:
      serviceAccountName: {{ $sa }}
      runtimeClassName: {{ $root.Values.sandbox.runtimeClassName }}
      automountServiceAccountToken: true
      nodeSelector:
        node-role: sandbox
      tolerations:
        - key: node-role
          operator: Equal
          value: sandbox
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: {{ include "meetings.image" (dict "registry" $root.Values.image.registry "image" $root.Values.sandbox.runtimeImage) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_INTERNAL_URL
              value: "http://{{ include "meetings.name" $root }}-backend.{{ $root.Release.Namespace }}.svc:8000"
            - name: SANDBOX_CAPABILITY_FILE
              value: /etc/sandbox/capabilities
            {{- if $profile.needsMetricsDsn }}
            - name: METRICS_DSN_FILE
              value: /etc/sandbox/secrets/metrics-dsn
            {{- end }}
            # Without this the trace stops at the backend, which is the least
            # interesting third of the work.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "meetings.otlpEndpoint" $root | quote }}
            - name: OTEL_SERVICE_NAME
              value: "meetings-persona-{{ $profile.name }}"
            - name: CORPUS_URL
              value: "http://{{ include "meetings.name" $root }}-corpus.{{ $root.Release.Namespace }}.svc:8080"
            - name: SANDBOX_EXEC_NAMESPACE
              value: {{ $root.Values.sandbox.execNamespace }}
            - name: MEETINGS_PROFILE
              value: {{ $profile.name }}
          volumeMounts:
            - name: capabilities
              mountPath: /etc/sandbox
              readOnly: true
            {{- if $profile.needsMetricsDsn }}
            - name: secrets
              mountPath: /etc/sandbox/secrets
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources: {{- toYaml $root.Values.sandbox.resources | nindent 12 }}
      volumes:
        - name: capabilities
          configMap:
            name: {{ $sa }}-capabilities
            items:
              - key: capabilities
                path: capabilities
        {{- if $profile.needsMetricsDsn }}
        {{/*
        The only credential a persona sandbox now carries, and only the profiles
        defined by holding it get the volume at all -- the others have no secret
        mount whatsoever, not an empty one.
        Not optional: a missing Secret should stop the pod rather than mount
        nothing and let the tool report an outage it cannot tell from a real one.
        */}}
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ $root.Values.sandbox.metricsSecret }}
                  items:
                    - key: dsn
                      path: metrics-dsn
        {{- end }}
        - name: tmp
          emptyDir: {}
---
{{/*
Unconditional, and that is the point. This was previously emitted only when
warmReplicas > 0, which reads like a reasonable way to opt out of holding idle
pods and is not: a sandbox is only ever obtained through a SandboxClaim, and
SandboxClaim.spec carries `warmPoolRef` and no template ref, so a profile with
no warm pool has no route to a sandbox at all. It stays selectable, so the
supervisor picks it and every claim fails with "SandboxWarmPool not found" --
one wasted turn per attempt, and no utterance.

profiles.py now refuses warm_replicas < 1 at import, so this condition could
never be false anyway. Emitting it unconditionally keeps the chart from
advertising an opt-out that does not exist.
*/}}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $sa }}
  namespace: {{ $root.Values.sandbox.namespace }}
  labels: {{- include "meetings.labels" $root | nindent 4 }}
spec:
  # Pre-warmed so no turn pays a cold gVisor pod start.
  replicas: {{ $profile.warmReplicas }}
  sandboxTemplateRef:
    name: {{ $sa }}
{{- end }}

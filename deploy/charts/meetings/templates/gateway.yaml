{{- if .Values.gateway.enabled }}
{{/*
Gateway API instead of an Ingress or an Istio VirtualService. Envoy Gateway
provides the GatewayClass (see deploy/bootstrap/gatewayclass.yaml) and handles
the WebSocket upgrade that /api/v1/meetings/{id}/ws depends on.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "meetings.name" . }}
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "meetings.name" . }}
  labels: {{- include "meetings.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "meetings.name" . }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    # More specific prefix first: /api/v1 must not be swallowed by /.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: {{ include "meetings.name" . }}-backend
          port: 8000
      timeouts:
        # Meetings stream for a long time over a single connection.
        request: 0s
        backendRequest: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "meetings.name" . }}-frontend
          port: 80
{{- end }}

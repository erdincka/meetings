# Vanilla Kubernetes. No Istio, no Kyverno, no vendor CRDs.

nameOverride: ""

image:
  registry: ""
  pullPolicy: IfNotPresent

backend:
  # Overridden by `make deploy` with a content-addressed tag. A mutable
  # `:latest` leaves the Deployment spec unchanged when the image is rebuilt, so
  # helm upgrade has nothing to roll and the pod keeps serving stale code -- a
  # deploy that reports success and changed nothing.
  image: meetings-backend:latest
  # Pinned to one replica: meetings.py keeps the active-meeting registry in
  # process memory, so a second replica would not see meetings owned by the
  # first. Lifting this needs lease-based ownership; see docs/operations.md.
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: "1",  memory: 1Gi}

frontend:
  image: meetings-frontend:latest
  replicas: 1
  resources:
    requests: {cpu: 50m,  memory: 128Mi}
    limits:   {cpu: 500m, memory: 512Mi}

database:
  # CloudNativePG publishes a complete connection URI in its generated app
  # Secret, so the chart consumes that key directly rather than assembling a
  # URL from parts. Assembling it invites two failure modes: passwords with
  # URL-significant characters need escaping, and Kubernetes only expands
  # $(VAR) references to variables declared EARLIER in the env list, which is
  # silent and easy to get wrong.
  existingSecret: meetings-postgres-app
  urlKey: uri

inference:
  # Any OpenAI-compatible endpoint: a hosted provider, a self-hosted vLLM, or
  # Ollama running on the developer's own machine. There is no in-cluster model
  # server -- serving a model well is a different problem from orchestrating
  # agents, and conflating them made the demo compete with its own sandboxes
  # for CPU.
  endpoint: ""
  modelName: ""
  ignoreTls: false

  # Reasoning models spend their token budget thinking before they answer, which
  # truncates bounded calls like the chair's speaker choice. Empty sends nothing,
  # because the accepted values differ by provider: OpenAI takes low/medium/high
  # and rejects "none", which is exactly what Ollama needs.
  reasoningEffort: ""
  # The chair is separate on purpose: its call is bounded and structured, so
  # reasoning truncates it, while an agent's turn has a far larger budget.
  supervisorReasoningEffort: ""

  # Per-request timeout. Hosted endpoints answer in seconds; a small model on
  # a developer laptop can take considerably longer, and the variance matters
  # more than the mean -- a tight timeout turns a slow turn into a failed one.
  timeoutSeconds: 120

  embedding:
    endpoint: ""
    modelName: ""
    ignoreTls: false
    # Must match the embedding model's output width. The initial migration
    # creates the vector column at this size and refuses to change it once
    # chunks exist.
    dimensions: 768

  # Credentials, when the endpoint needs them. Both keys are optional: local
  # providers accept no authentication at all, and the code sends a placeholder
  # rather than failing to construct a client.
  existingSecret: meetings-runtime
  apiKeyKey: INFERENCE_API_KEY
  embeddingApiKeyKey: EMBEDDING_API_KEY

  # No sandbox egress list. Personas reach the model through the backend's
  # /internal/v1/llm proxy, so nothing needs a route to the provider except the
  # backend itself -- which is not sandboxed. This used to be a list of CIDRs
  # the endpoint resolved to, which no hosted provider can honestly supply.

sandbox:
  # Never hardcode gvisor in a template: hosts without runsc fall back to
  # `crun` (user namespaces) or `runc`. See docs/sandbox-security-model.md.
  runtimeClassName: gvisor
  namespace: meetings-sandboxes
  execNamespace: meetings-exec
  runtimeImage: meetings-persona-runtime:latest
  execImage: meetings-exec-python:latest
  # Read-only DSN for the metrics schema, mounted only by profiles granted it.
  metricsSecret: meetings-metrics-ro
  execWarmReplicas: 1
  execResources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: "2",  memory: 1Gi}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: "1",  memory: 768Mi}

  # One image, many profiles. What each profile may do is set by its
  # SandboxTemplate -- capability file, ServiceAccount, NetworkPolicy, Secrets --
  # not by the image. The generated `profiles:` block below is the full set.
  profiles:
    baseline:
      # Warm, so no turn pays a cold gVisor pod start (seconds, versus a few
      # hundred milliseconds for a warm claim).
      warmReplicas: 2
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits:   {cpu: "1",  memory: 768Mi}

# Operator authentication.
#
# Two roles, split by what a mistake costs: a viewer reads meetings, transcripts
# and the capability matrix; an operator additionally edits personas, settings
# and meetings. That is the split that matters here rather than a generic
# read/write one, because a persona's tool grant resolves to a capability
# profile and the profile decides which ServiceAccount its sandbox runs under --
# editing a persona is a privilege change.
#
# Tokens are generated on first install and kept across upgrades (see
# templates/secrets.yaml). Read them with `make operator-token`.
auth:
  # Turning this off makes every API caller an operator. Legitimate for a
  # single-user development cluster and nowhere else; the backend logs a warning
  # at startup so it cannot be forgotten quietly.
  enabled: true
  existingSecret: ""
  operatorTokenKey: OPERATOR_TOKEN
  viewerTokenKey: VIEWER_TOKEN

gateway:
  enabled: true
  className: envoy
  host: meetings.localtest.me

  # HTTPS, off by default and deliberately so. A trusted certificate needs a
  # domain you own and an ACME account, and making either one a prerequisite
  # would put a DNS registration in front of `make deploy` for someone who only
  # wants to see the thing run. Plain HTTP against a LAN hostname stays the
  # supported default path; this is additive.
  tls:
    enabled: false
    # The Secret holding tls.crt and tls.key, in the release namespace. Empty
    # means "<release>-tls". The listener only ever names a Secret -- whether
    # you created it with `kubectl create secret tls` or cert-manager filled it
    # is not something the Gateway knows or cares about.
    secretName: ""
    # Hand the Secret to cert-manager instead of creating it yourself. Needs
    # cert-manager built with --enable-gateway-api (its gateway-shim), which
    # watches this annotation and writes the Certificate for you.
    #
    # For a host that resolves to a private address, the ACME challenge must be
    # dns01: http01 asks Let's Encrypt to connect inbound, and it cannot reach
    # RFC 1918 space. That is a property of the issuer you reference here, not
    # of anything in this chart.
    issuerRef:
      name: ""
      # ClusterIssuer or Issuer.
      kind: ClusterIssuer
    # Redirect :80 to :443. Leave off until the certificate is actually trusted
    # -- a redirect to a cert nothing accepts turns a working HTTP deployment
    # into an unreachable one, and the browser error names the certificate
    # rather than the redirect that caused it.
    redirect: false

observability:
  # One switch for the whole stack: the ServiceMonitor, the OTLP endpoint handed
  # to the backend and to every sandbox, and the Grafana listener on the Gateway.
  #
  # This was three independent settings turned on by a separate `make
  # deploy-observed` target, so a later plain `make deploy` silently reverted
  # them -- the ServiceMonitor disappeared, tracing stopped, and every dashboard
  # panel read "no data" with nothing anywhere in an error state. One flag, set
  # in cluster.env, cannot half-apply that way.
  #
  # Off by default: the CRDs it depends on are not on every cluster, and a
  # ServiceMonitor referencing an absent CRD fails `helm install` for someone
  # who only wanted to run the app.
  enabled: false
  prometheusRelease: kube-prometheus-stack
  # Where traces go when enabled. Ignored entirely when it is not, so nothing
  # retries against a collector that was never installed.
  otlpEndpoint: "http://tempo.observability.svc:4317"
  # Hostname for Grafana on the app's Gateway. Empty adds no listener.
  gatewayHost: ""
  namespace: observability

# Static corpus backing search_corpus. Offline so runs stay reproducible.
corpus:
  enabled: true
  image: meetings-corpus:latest

logLevel: INFO
allowVolatileCheckpoints: false

# GENERATED FILE -- do not edit.
#
# Source: backend/app/orchestration/profiles.py
# Regenerate: scripts/generate-profile-values.sh
#
# Each entry becomes a ServiceAccount, a capability ConfigMap, a SandboxTemplate
# with its own NetworkPolicy, and (where warmReplicas > 0) a SandboxWarmPool.
# `canExecuteCode` is the one that matters most: it decides whether the profile's
# ServiceAccount is bound to the exec-sandbox-claimer Role, and therefore whether
# the apiserver will let its sandboxes claim a code-execution sandbox at all.
profiles:

  - name: baseline
    description: 'Reads the shared library, drafts artifacts, records actions.'
    canExecuteCode: false
    needsMetricsDsn: false
    needsCorpusEgress: false
    warmReplicas: 2
    tools:
      - draft_artifact
      - read_artifact
      - record_action_item
      - retrieve_documents

  - name: counsel
    description: 'Baseline plus deterministic policy checks.'
    canExecuteCode: false
    needsMetricsDsn: false
    needsCorpusEgress: false
    warmReplicas: 1
    tools:
      - check_policy_compliance
      - draft_artifact
      - read_artifact
      - record_action_item
      - retrieve_documents

  - name: strategist
    description: 'Baseline plus the external corpus.'
    canExecuteCode: false
    needsMetricsDsn: false
    needsCorpusEgress: true
    warmReplicas: 1
    tools:
      - draft_artifact
      - read_artifact
      - record_action_item
      - retrieve_documents
      - search_corpus

  - name: analyst
    description: 'Baseline plus read-only business metrics. Cannot execute code.'
    canExecuteCode: false
    needsMetricsDsn: true
    needsCorpusEgress: false
    warmReplicas: 1
    tools:
      - draft_artifact
      - query_business_metrics
      - read_artifact
      - record_action_item
      - retrieve_documents

  - name: quant
    description: 'Metrics plus model-authored analysis, executed in a network-isolated sandbox.'
    canExecuteCode: true
    needsMetricsDsn: true
    needsCorpusEgress: false
    warmReplicas: 1
    tools:
      - draft_artifact
      - query_business_metrics
      - read_artifact
      - record_action_item
      - retrieve_documents
      - run_python_analysis

  - name: chief
    description: 'Broad read access across metrics, policy and corpus. No code execution.'
    canExecuteCode: false
    needsMetricsDsn: true
    needsCorpusEgress: true
    warmReplicas: 1
    tools:
      - check_policy_compliance
      - draft_artifact
      - query_business_metrics
      - read_artifact
      - record_action_item
      - retrieve_documents
      - search_corpus

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meetings

# Replicated from the k3s cluster this replaces, where all three were verified
# enabled. ImageVolume is what lets CloudNativePG mount pgvector declaratively;
# UserNamespacesSupport backs the `crun` fallback tier if gVisor is unavailable.
networking:
  # kindnetd, kind's default CNI, does not implement NetworkPolicy at all --
  # policies apply cleanly and are simply never enforced. For a project whose
  # argument is that Kubernetes enforces the boundaries, an inert enforcement
  # layer is worse than no claim at all, so the default CNI is disabled and
  # Calico is installed by the bootstrap.
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"

featureGates:
  ImageVolume: true
  UserNamespacesSupport: true
  InPlacePodVerticalScaling: true

# Register the gVisor runtime handler. kind v0.32 nodes ship containerd 2.x
# (plugin "io.containerd.cri.v1.runtime"); the 1.x path is included too so this
# config survives a node-image downgrade. Unknown sections are ignored.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runsc]
      runtime_type = "io.containerd.runsc.v1"
      pod_annotations = ["dev.gvisor.*"]
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
      runtime_type = "io.containerd.runsc.v1"
      pod_annotations = ["dev.gvisor.*"]
  - |-
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

nodes:
  - role: control-plane
    image: kindest-node-runsc:v1.36.1
    kubeadmConfigPatches:
      # kind does not reliably propagate top-level featureGates to the kubelet.
      - |
        kind: KubeletConfiguration
        featureGates:
          ImageVolume: true
          UserNamespacesSupport: true
          InPlacePodVerticalScaling: true
      - |
        kind: InitConfiguration
        nodeRegistration:
          # kind keeps the control-plane NoSchedule taint once a worker exists.
          # Clear it: this node carries the platform and app workloads, while the
          # worker below is reserved exclusively for sandboxes.
          taints: []
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP

  # Sandbox workloads land here, tainted so a runaway sandbox cannot starve the
  # control plane. Costs ~400MB; worth it.
  - role: worker
    image: kindest-node-runsc:v1.36.1
    labels:
      node-role: sandbox
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        featureGates:
          ImageVolume: true
          UserNamespacesSupport: true
          InPlacePodVerticalScaling: true
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: node-role
              value: sandbox
              effect: NoSchedule
